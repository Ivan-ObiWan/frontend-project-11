<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSS Агрегатор</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div class="main-content">
    <div class="hero-section">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-8 col-lg-6">
            <h1></h1>
            <p class="lead"></p>
          </div>
        </div>
      </div>
    </div>

    <div class="container mt-4">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <form id="rss-form" novalidate>
            <div class="mb-3">
              <div class="d-flex gap-2">
                <input
                  type="text"
                  class="form-control"
                  id="rss-url"
                  name="url"
                  aria-label="url"
                  placeholder="Ссылка RSS"
                  required
                >
                <button type="submit" class="btn btn-primary">Добавить</button>
              </div>
              <div class="form-text mt-2">Пример: https://lorem-rss.hexlet.app/feed</div>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="container mt-4">
      <div class="row">
        <div class="col-md-7">
          <div id="posts" class="posts">
            <h3>Посты</h3>
            <ul class="posts-list">
              <li class="post-item">
                <a href="#" class="post-link fw-bold">Агрегация / Python: Деревья</a>
                <span class="post-date">16.06.2026</span>
                <button class="post-view-button" data-bs-toggle="modal" data-bs-target="#postModal" data-post-id="test-1">Просмотр</button>
              </li>
              <li class="post-item">
                <a href="#" class="post-link fw-bold">Traversal / Python: Деревья</a>
                <span class="post-date">16.06.2026</span>
                <button class="post-view-button" data-bs-toggle="modal" data-bs-target="#postModal" data-post-id="test-2">Просмотр</button>
              </li>
            </ul>
          </div>
        </div>
        <div class="col-md-5">
          <div id="feeds" class="feeds">
            <h3>Фиды</h3>
            <div class="feed-item">
              <h3 class="feed-title">Новые уроки на Хекслете</h3>
              <div class="feed-description">Практические уроки по программированию</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="text-muted">
    created by <a href="https://hexlet.io" target="_blank" style="color: #0d6efd; text-decoration: none;">Hexlet</a>
  </footer>

  <div class="modal fade" id="postModal" tabindex="-1" aria-labelledby="postModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="postModalLabel">Заголовок поста</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
        </div>
        <div class="modal-body">
          <p></p>
        </div>
        <div class="modal-footer">
          <a href="#" class="btn btn-primary" id="readFullLink" target="_blank">Читать полностью</a>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
