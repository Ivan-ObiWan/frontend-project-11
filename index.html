<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSS Агрегатор</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div class="hero-section">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <h1></h1>
          <p class="lead"></p>
        </div>
      </div>
    </div>
  </div>

  <div class="container mt-4">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <form id="rss-form" novalidate>
          <div class="mb-3">
            <div class="d-flex gap-2">
              <input 
                type="text" 
                class="form-control" 
                id="rss-url" 
                placeholder="Ссылка RSS"
              >
              <button type="submit" class="btn btn-primary"></button>
            </div>
            <div class="form-text mt-2"></div>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="container mt-4">
    <div class="row">
      <div class="col-md-7">
        <div id="posts"></div>
      </div>
      <div class="col-md-5">
        <div id="feeds"></div>
      </div>
    </div>
  </div>

  <div class="container mt-4">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <hr class="my-4">
        <footer class="text-muted mt-4" id="footer"></footer>
      </div>
    </div>
  </div>

   <div class="modal fade" id="postModal" tabindex="-1" aria-labelledby="postModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="postModalLabel">Заголовок поста</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
        </div>
        <div class="modal-body">
          <p>Содержимое поста...</p>
        </div>
        <div class="modal-footer">
          <a href="#" class="btn btn-primary" id="readFullLink" target="_blank">Читать полностью</a>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
        </div>
      </div>
    </div>
  </div>
  
  <script type="module" src="/src/main.js"></script>
</body>
</html>
