<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSS Агрегатор</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div class="hero-section">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 text-center">
          <h1>RSS агрегатор</h1>
          <p class="lead">Начните читать RSS сегодня! Это легко, это красиво.</p>
        </div>
      </div>
    </div>
  </div>

  <div class="container mt-4">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <!-- Форма -->
        <form id="rss-form" novalidate>
          <div class="mb-3">
            <label for="rss-url" class="form-label fw-bold">Ссылка RSS</label>
            <div class="d-flex gap-2">
              <input 
                type="url" 
                class="form-control" 
                id="rss-url" 
                placeholder="https://example.com/rss.xml"
                required
              >
              <button type="submit" class="btn btn-primary">Добавить</button>
            </div>
            <div class="form-text mt-2">
              Пример: https://lorem-rss.hexlet.app/feed
            </div>
          </div>
        </form>

        <hr class="my-4">

        <div id="feeds"></div>

        <footer class="text-center text-muted mt-4">
          created by Hexlet
        </footer>
      </div>
    </div>
  </div>
  
  <script type="module" src="/src/main.js"></script>
</body>
</html>
