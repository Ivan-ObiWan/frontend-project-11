<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSS Агрегатор</title>
  <script type="module" crossorigin src="/frontend-project-11/assets/index-C6EutBhd.js"></script>
  <link rel="stylesheet" crossorigin href="/frontend-project-11/assets/index-BY76mC_P.css">
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <!-- Заголовок -->
        <h1 class="text-center">RSS агрегатор</h1>
        <p class="text-center lead">
          Начните читать RSS сегодня! Это легко, это красиво.
        </p>

        <!-- Форма -->
        <form id="rss-form">
          <div class="form-group">
            <label for="rss-url" class="form-label fw-bold">Ссылка RSS</label>
            <div class="input-group">
              <input 
                type="url" 
                class="form-control" 
                id="rss-url" 
                placeholder="https://example.com/rss.xml"
                required
              >
              <button type="submit" class="btn btn-primary">Добавить</button>
            </div>
            <div class="form-text mt-2">
              Пример: https://lorem-rss.hexlet.app/feed
            </div>
          </div>
        </form>

        <!-- Разделитель -->
        <hr class="my-4">

        <!-- Контейнер для фидов -->
        <div id="feeds"></div>

        <!-- Футер -->
        <footer class="text-center text-muted mt-4">
          created by Hexlet
        </footer>
      </div>
    </div>
  </div>
  
</body>
</html>
